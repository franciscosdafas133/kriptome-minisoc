# AUTH_BRUTEFORCE_SUCCESS
# Login exitoso tras un ataque de fuerza bruta -- el cambio material mas
# critico de autenticacion (doc 02 Escenario C). Cubre tanto SSH como
# Windows: son el mismo case_type de negocio con dos rutas de deteccion.
#
# CORRECCION v1.3.0: el fingerprint anterior (tenant_id+asset_id+case_type+
# source_ip) era inconsistente con sus propios material_changes, que
# listaban "nuevo source_ip" y "otro asset" como cambio material DEL MISMO
# CASO. Eso es imposible: source_ip y asset_id son CAMPOS DEL FINGERPRINT
# -- si cambian, por definicion se genera un fingerprint distinto y por lo
# tanto un CASO NUEVO, no una actualizacion del caso existente. Se corrige
# asi: (a) el fingerprint gana target_user para diferenciar cuentas
# atacadas desde la misma IP/asset; (b) los material_changes se limitan a
# los que SI son compatibles con un fingerprint fijo; (c) la relacion
# entre casos con fingerprints distintos (multi-IP, multi-asset, multi-
# cuenta) se modela aparte como campaign_correlation, no como cambio
# material de un caso individual.

case_type: AUTH_BRUTEFORCE_SUCCESS

source_rules:
  - rule_id: "100012"
    wazuh_family: SSH
    validation_status: VALIDADO-XML
    note: "if_sid=5715 + if_matched_sid=100010 + same_source_ip; timeframe=600"
  - rule_id: "100013"
    wazuh_family: "Windows auth"
    validation_status: VALIDADO-XML
    note: >-
      if_sid=60106 + if_matched_sid=60204 + same_field win.eventdata.ipAddress;
      timeframe=600. LIMITACION IMPORTANTE (ver REGLAS_TUNEADAS/wazuh/rules/kriptome_local_rules.xml
      y specifications/auth_evidence.schema.json): 60204 correlaciona por
      win.eventdata.ipAddress, NO por targetUserName -- esta regla NO
      demuestra por si sola que los fallos previos fueron contra la MISMA
      cuenta del login exitoso. Ver auth_context/matching_user_verified
      mas abajo y la seccion 7 de este archivo.

fingerprint_fields:
  - tenant_id
  - asset_id
  - case_type
  - source_ip
  - target_user
# CORREGIDO v1.3.0: se agrega target_user. Sin este campo, dos ataques
# simultaneos desde la misma IP contra DOS cuentas distintas del mismo
# asset colisionarian en el mismo caso, mezclando su evidencia. Con
# target_user en el fingerprint, cada combinacion IP+cuenta+asset abre su
# propio caso -- y la relacion entre esos casos (si existe) se modela via
# campaign_correlation, no fusionandolos.

dedupe_window: PT10M   # timeframe=600 de ambas reglas

auto_close_after: null   # CRITICAL -- nunca se auto-cierra, requiere cierre humano

reopen_policy:
  reopens_if: "nuevo evento con el MISMO fingerprint (misma tenant_id+asset_id+source_ip+target_user) dentro de 24h del cierre"
  action: "reabre el caso existente, NO crea uno nuevo"

material_changes:
  # Solo cambios COMPATIBLES con un fingerprint fijo (tenant+asset+ip+user
  # sin variar) -- ninguno de estos altera el fingerprint del caso.
  - "aumento relevante de intentos fallidos dentro de la misma combinacion source_ip+target_user"
  - "aparicion de un nuevo login exitoso adicional dentro de la misma combinacion (el atacante repite el patron)"
  - "la cuenta target_user se confirma como privilegiada (dato de asset_context/CMDB que no se conocia al abrir el caso)"
  - "el activo se reclasifica de criticidad media/baja a alta/critica (dato de asset_context que cambia, no el asset_id)"
  - "el source_ip se confirma como malicioso via enriquecimiento de reputacion (dato nuevo sobre el mismo IOC, no un IOC distinto)"
  - "actividad posterior detectada en el mismo asset tras el acceso exitoso (p. ej. un evento FIM o Sysmon correlacionado por asset_id+ventana de tiempo, no un nuevo caso AUTH_BRUTEFORCE_SUCCESS)"
  - "reaparicion del mismo patron (misma combinacion source_ip+target_user) dentro de la ventana de reapertura definida arriba"

removed_as_material_change:
  # Documentado explicitamente para que no se reintroduzca el error: estos
  # NO son cambios materiales de ESTE case_type porque alteran el
  # fingerprint -- cualquiera de estos SIEMPRE abre un caso nuevo.
  - "un source_ip diferente al que origino el caso -- fingerprint distinto, caso nuevo (ver campaign_correlation si se quiere relacionar con el caso original)"
  - "un asset_id diferente -- fingerprint distinto, caso nuevo por definicion (el fingerprint ya incluye asset_id)"

routing:
  wazuh_route: CRITICAL
  client_priority_level: critico
  quiet_hours_apply: false
  notification_template: "5.2"   # DOCUMENTOS/07_COMUNICACION_CON_EL_CLIENTE.docx (fuente historica; ver nota de desalineacion A/B/C en specifications/client_notification.schema.json)

human_review_required: true   # doc 04 A.3: CRITICAL siempre humano, IA no descarta

auth_evidence_requirements:
  # Ver specifications/auth_evidence.schema.json para el contrato completo.
  matching_user_verified_required_for_communication: true
  note: >-
    Antes de redactar cualquier notificacion al cliente para un caso de
    este case_type originado por la regla 100013 (correlacion por IP, no
    por cuenta), se debe verificar matching_user_verified. Si es false, la
    comunicacion NO puede afirmar "N intentos fallidos contra la cuenta
    {target_user}" -- debe usar la redaccion alternativa que separa el
    conteo de fallos (por IP) del login exitoso (por cuenta). Ver detalle
    completo en la seccion 7 de este archivo y en
    specifications/auth_evidence.schema.json ($comment de regla de
    comunicacion).

known_limitations:
  - "Aislamiento multi-tenant del CONTEO (no de la atribucion del caso) es PENDIENTE -- ver specifications/tenant_resolution.md §2"
  - "Depende de 100010 (SSH) / 60204 (Windows) como if_matched_sid; ver rule_id de esas reglas para su propio estado"
  - "100013 (Windows) correlaciona por IP, no por cuenta -- requiere el paso adicional de verificacion descrito en auth_evidence_requirements antes de nombrar la cuenta en un mensaje al cliente como si todos los fallos hubieran sido contra ella"

policy_validation_status: DISEÑADO

# campaign_correlation: relaciona CASOS DISTINTOS (fingerprints distintos)
# del mismo tenant que comparten un origen o patron comun. NO fusiona los
# casos tecnicos entre si -- cada uno mantiene su propio case_id,
# evidencia y ciclo de vida; esto es una capa de correlacion adicional
# para el operador/informe, no un cambio en como se abren casos.
campaign_correlation:
  applies_when:
    - "el mismo source_ip ataca varios assets del mismo tenant (mismo IOC, distintos asset_id -> distintos fingerprints/casos)"
    - "el mismo source_ip ataca varias cuentas (mismo IOC, distintos target_user -> distintos fingerprints/casos)"
    - "varios source_ip distintos atacan la misma cuenta (mismo target_user+asset_id, distintos source_ip -> distintos fingerprints/casos; posible ataque distribuido/password spraying coordinado)"
  never_correlates_across: tenant_id
  # Regla dura: una campaña NUNCA cruza tenants, aunque el mismo source_ip
  # ataque a dos clientes distintos de Kriptome (ver specifications/tenant_resolution.md
  # §2 sobre el riesgo de conteo cross-tenant en las correlaciones nativas
  # de Wazuh -- la campana de negocio no debe repetir ese error a nivel App).
  output_fields:
    campaign_id: "identificador propio de la campaña, distinto de cualquier case_id"
    related_case_ids: "lista de case_id (AUTH_BRUTEFORCE_SUCCESS u otros) que forman parte de esta campaña"
    tenant_id: "un unico tenant_id -- ver never_correlates_across"
    correlation_type: "uno de: same_ip_multi_asset | same_ip_multi_user | multi_ip_same_user"
    first_seen_at: "primer evento de cualquiera de los casos relacionados"
    last_seen_at: "evento mas reciente de cualquiera de los casos relacionados"
    affected_assets: "lista de asset_id involucrados"
    affected_users: "lista de target_user involucrados"
    source_ips: "lista de source_ip involucrados"
  policy_validation_status: DISEÑADO
